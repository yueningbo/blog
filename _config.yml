title: 阅读与写作
tagline: 收录与原创
description: >-
  一个个人博客：收录值得反复读的文章（按原文排版重排、标明出处），也写自己的东西。
lang: zh-CN
author: yueningbo
github_url: https://github.com/yueningbo/blog

url: https://yueningbo.github.io
baseurl: /blog

permalink: /posts/:title.html

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: feed.xml
  posts_limit: 30

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - vendor
  - .bundle
