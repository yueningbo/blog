<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
{% include head.html %}
</head>
<body>
{% unless page.hide_progress %}<div id="progress"></div>{% endunless %}

<header class="site-header">
  <a class="brand" href="{{ '/index.html' | relative_url }}"><span class="dot"></span>{{ site.title }}</a>
  <nav>
    <a href="{{ '/tags.html' | relative_url }}">标签</a>
    <a href="{{ '/about.html' | relative_url }}">关于</a>
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    <a href="{{ site.github_url }}">GitHub</a>
  </nav>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换深色/浅色模式" title="切换深色/浅色模式">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z"/>
    </svg>
  </button>
</header>

{{ content }}

<footer class="site-footer">
  <span>收录内容版权归原作者；原创内容版权归我</span>
  <span>{{ site.title }} · <a href="{{ site.github_url }}">GitHub</a></span>
</footer>

<script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
